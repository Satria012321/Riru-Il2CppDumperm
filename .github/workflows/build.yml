name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game (e.g. com.example.game):"
        required: true
        type: string

jobs:
  build:
    name: Build Zygisk Il2CppDumper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Patch package name
        run: |
          echo "Patching package name: ${{ github.event.inputs.package_name }}"
          sed -i 's/moduleDescription = \"/moduleDescription = \"(${{ github.event.inputs.package_name }}) /g' module.gradle
          sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h

      - name: Build with Gradle
        run: ./gradlew :module:assembleRelease --no-daemon --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper-${{ github.event.inputs.package_name }}
          path: out/magisk_module_release/
          if-no-files-found: error
          retention-days: 7
          
